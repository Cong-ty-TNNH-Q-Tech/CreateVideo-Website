name: Docker Build, Optimize & Push

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        id: image_name
        run: |
          IMAGE_NAME_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME_LOWER=${IMAGE_NAME_LOWER}" >> $GITHUB_ENV
          echo "image_name=${IMAGE_NAME_LOWER}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image (unoptimized)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: application
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME_LOWER }}:pre-slim
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install docker-slim
        run: |
          curl -L -o ds.tar.gz https://github.com/slimtoolkit/slim/releases/download/1.40.11/dist_linux.tar.gz
          tar -xvzf ds.tar.gz
          sudo mv dist_linux/* /usr/local/bin/
          docker-slim --version

      - name: Optimize image with docker-slim
        id: slim
        run: |
          # Create probe commands file for SadTalker app
          cat > .slim-probe-commands << 'EOF'
          # Health check probes
          curl -f http://localhost:5000/ || echo "Root endpoint check"
          curl -f http://localhost:5000/health || echo "Health endpoint check"
          
          # Allow time for app initialization
          sleep 30
          EOF
          
          # Run docker-slim with comprehensive settings
          docker-slim build \
            --target ${{ env.IMAGE_NAME_LOWER }}:pre-slim \
            --tag ${{ env.IMAGE_NAME_LOWER }}:slim \
            --http-probe=false \
            --continue-after=30 \
            --show-clogs \
            --show-blogs \
            --include-path '/app' \
            --include-path '/usr/lib/python3.11' \
            --include-path '/usr/lib/python3' \
            --include-path '/usr/local/lib/python3.11' \
            --include-path '/usr/lib/x86_64-linux-gnu' \
            --include-path '/lib/x86_64-linux-gnu' \
            --include-path '/usr/bin/python3.11' \
            --include-path '/usr/bin/ffmpeg' \
            --include-bin '/usr/bin/curl' \
            --include-exe '/usr/bin/python3.11' \
            --include-exe '/usr/bin/ffmpeg' \
            --preserve-path '/app/static' \
            --preserve-path '/app/data' \
            --preserve-path '/app/app/SadTalker' \
            --preserve-path '/app/app/VieNeu-TTS' \
            --env PYTHONUNBUFFERED=1 \
            --env FLASK_APP=run.py \
            --expose 5000 \
            || echo "docker-slim completed with warnings"
          
          # Get image sizes
          ORIGINAL_SIZE=$(docker images --format "{{.Size}}" ${{ env.IMAGE_NAME_LOWER }}:pre-slim)
          SLIM_SIZE=$(docker images --format "{{.Size}}" ${{ env.IMAGE_NAME_LOWER }}:slim)
          
          echo "original_size=${ORIGINAL_SIZE}" >> $GITHUB_OUTPUT
          echo "slim_size=${SLIM_SIZE}" >> $GITHUB_OUTPUT
          
          # Calculate reduction percentage
          ORIGINAL_BYTES=$(docker inspect ${{ env.IMAGE_NAME_LOWER }}:pre-slim --format='{{.Size}}')
          SLIM_BYTES=$(docker inspect ${{ env.IMAGE_NAME_LOWER }}:slim --format='{{.Size}}')
          REDUCTION=$(python3 -c "print(f'{(1 - ${SLIM_BYTES}/${ORIGINAL_BYTES})*100:.1f}')")
          echo "reduction_percent=${REDUCTION}" >> $GITHUB_OUTPUT

      - name: Compare image sizes
        run: |
          # ── raw byte counts ──────────────────────────────────────────────
          BEFORE_BYTES=$(docker inspect ${{ env.IMAGE_NAME_LOWER }}:pre-slim --format='{{.Size}}')
          AFTER_BYTES=$(docker inspect ${{ env.IMAGE_NAME_LOWER }}:slim --format='{{.Size}}')

          # ── human-readable labels ─────────────────────────────────────────
          BEFORE_HR=$(docker images --format "{{.Size}}" ${{ env.IMAGE_NAME_LOWER }}:pre-slim)
          AFTER_HR=$(docker images --format "{{.Size}}" ${{ env.IMAGE_NAME_LOWER }}:slim)

          # ── reduction % ───────────────────────────────────────────────────
          REDUCTION=$(python3 -c "print(f'{(1 - ${AFTER_BYTES}/${BEFORE_BYTES})*100:.1f}')")
          SAVED=$(python3 -c "
          saved = ${BEFORE_BYTES} - ${AFTER_BYTES}
          if saved >= 1073741824:
              print(f'{saved/1073741824:.2f} GB')
          elif saved >= 1048576:
              print(f'{saved/1048576:.0f} MB')
          else:
              print(f'{saved/1024:.0f} KB')
          ")

          # ── print to log ──────────────────────────────────────────────────
          echo "============================================"
          echo "  Docker Image Size Comparison"
          echo "============================================"
          echo "  Before optimisation : ${BEFORE_HR}  (${BEFORE_BYTES} bytes)"
          echo "  After  optimisation : ${AFTER_HR}  (${AFTER_BYTES} bytes)"
          echo "  Saved               : ${SAVED}  (${REDUCTION}% reduction)"
          echo "============================================"

          # ── write to GitHub Step Summary (visible in Actions UI) ──────────
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 📦 Image Size Comparison

          | | Size | Bytes |
          |---|---|---|
          | **Before** (pre-slim) | ${BEFORE_HR} | ${BEFORE_BYTES} |
          | **After** (slim) | ${AFTER_HR} | ${AFTER_BYTES} |
          | **Saved** | ${SAVED} | ${REDUCTION}% reduction |

          > Built on \`$(date -u '+%Y-%m-%d %H:%M UTC')\` — commit \`${{ github.sha }}\`
          EOF

      - name: Test optimized image
        run: |
          # Start container for testing
          docker run -d \
            --name test-container \
            -p 5000:5000 \
            -e FLASK_APP=run.py \
            -e FLASK_ENV=production \
            ${{ env.IMAGE_NAME_LOWER }}:slim
          
          # Wait for container to start
          sleep 15
          
          # Basic health checks (use -a to include stopped containers)
          docker ps -a | grep test-container || echo "Container not found in list"
          docker logs test-container || echo "Could not retrieve logs"
          
          # Check container state
          CONTAINER_STATUS=$(docker inspect --format='{{.State.Status}}' test-container 2>/dev/null || echo "unknown")
          echo "Container status: ${CONTAINER_STATUS}"
          
          if [ "${CONTAINER_STATUS}" != "running" ]; then
            echo "WARNING: Container is not running (status: ${CONTAINER_STATUS}). Checking exit code..."
            docker inspect --format='{{.State.ExitCode}}' test-container || true
          fi
          
          # Test if app is responding (non-fatal)
          curl -f http://localhost:5000/ || echo "App endpoint test (expected if app requires ML models)"
          
          # Cleanup (always run)
          docker stop test-container 2>/dev/null || true
          docker rm test-container 2>/dev/null || true

      - name: Re-tag optimized image with all metadata tags
        if: github.event_name != 'pull_request'
        run: |
          # Tag the slim image with all the metadata tags
          IFS=',' read -ra TAGS <<< "${{ steps.meta.outputs.tags }}"
          for tag in "${TAGS[@]}"; do
            docker tag ${{ env.IMAGE_NAME_LOWER }}:slim ${tag}
            echo "Tagged: ${tag}"
          done

      - name: Push optimized image to GHCR
        if: github.event_name != 'pull_request'
        run: |
          # Push all tags
          IFS=',' read -ra TAGS <<< "${{ steps.meta.outputs.tags }}"
          for tag in "${TAGS[@]}"; do
            docker push ${tag}
            echo "Pushed: ${tag}"
          done

      - name: Create optimization report
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const originalSize = '${{ steps.slim.outputs.original_size }}';
            const slimSize = '${{ steps.slim.outputs.slim_size }}';
            const reduction = '${{ steps.slim.outputs.reduction_percent }}';
            
            const report = `## 🐳 Docker Image Optimization Report
            
            ### Image Sizes
            - **Original Image**: ${originalSize}
            - **Optimized Image**: ${slimSize}
            - **Size Reduction**: ${reduction}%
            
            ### Tags Pushed
            \`\`\`
            ${{ steps.meta.outputs.tags }}
            \`\`\`
            
            ### Pull Command
            \`\`\`bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:latest
            \`\`\`
            
            ### Run Command
            \`\`\`bash
            docker run -d \\
              -p 5000:5000 \\
              -e GEMINI_API_KEY=your_key \\
              --gpus all \\
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:latest
            \`\`\`
            `;
            
            // Post as comment if this is related to a commit
            if (context.eventName === 'push') {
              core.summary
                .addRaw(report)
                .write();
            }

      - name: Clean up
        if: always()
        run: |
          docker rmi ${{ env.IMAGE_NAME_LOWER }}:pre-slim || true
          docker rmi ${{ env.IMAGE_NAME_LOWER }}:slim || true
