# CPU-only override — use when no NVIDIA GPU / Container Toolkit is available.
# Usage: docker compose -f docker-compose.prod.yml -f docker-compose.cpu.yml up -d

services:
  videoteaching:
    deploy:
      resources:
        reservations:
          devices: []
    environment:
      - CUDA_VISIBLE_DEVICES=""
      - NVIDIA_VISIBLE_DEVICES=void
